name: Build Horizon Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract three project parts
        run: |
          mkdir extracted
          unzip -q horizon-android-part-01.zip -d extracted
          unzip -q horizon-android-part-02.zip -d extracted
          unzip -q horizon-android-part-03.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library
        working-directory: extracted/horizon-main
        run: |
          cargo ndk -t arm64-v8a \
            -o android/app/src/main/jniLibs build \
            --manifest-path android-app/Cargo.toml \
            --lib --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: extracted/horizon-main
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-APK
          path: extracted/horizon-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
