name: Extract and Merge Archives Together

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract and Merge Synchronously
        run: |
          python -c "
          import os, zipfile, shutil
          
          parts = ['horizon-android-part-01.zip', 'horizon-android-part-02.zip', 'horizon-android-part-03.zip']
          merged_dir = 'unified_merged_folder'
          
          for p in parts:
              if not os.path.exists(p):
                  print(f'Error: {p} is missing.'); exit(1)
          
          if os.path.exists(merged_dir): shutil.rmtree(merged_dir)
          os.makedirs(merged_dir, exist_ok=True)
          
          print('>>> Extracting and merging files into a unified folder...')
          for p in parts:
              try:
                  with zipfile.ZipFile(p, 'r') as z:
                      z.extractall(merged_dir)
                  print(f'Extracted and merged: {p}')
              except Exception as e:
                  print(f'Error processing {p}: {e}')
          
          if os.path.exists('MJLauncher.apk'): os.remove('MJLauncher.apk')
          
          try:
              shutil.make_archive('MJLauncher', 'zip', merged_dir)
              os.rename('MJLauncher.zip', 'MJLauncher.apk')
              print('>>> Success: Bundle generated as MJLauncher.apk')
          except Exception as e:
              print(f'Error during final bundling: {e}'); exit(1)
              
          shutil.rmtree(merged_dir)
          "

      - name: Upload Output APK File
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-Build
          path: MJLauncher.apk
          
