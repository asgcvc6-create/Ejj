name: Compile Source and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compiler_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          elif [ -f "./horizon-main/gradlew" ]; then
            cd horizon-main && chmod +x gradlew
          fi

      - name: Build Android App with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "./horizon-main/gradlew" ]; then
            cd horizon-main && ./gradlew assembleDebug
          else
            echo "Error: Gradle wrapper not found in the repository."
            exit 1
          fi

      - name: Locate and Rename Finished APK
        run: |
          FOUND_APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            mv "$FOUND_APK" ./MJLauncher.apk
            echo "Success: Compiled and renamed to MJLauncher.apk"
          else
            echo "CRITICAL ERROR: Build finished but no APK file was generated."
            exit 1
          fi

      - name: Upload Output APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-App-Package
          path: MJLauncher.apk
          
