name: Merge Files and Extract APK

on:
  workflow_dispatch:

jobs:
  merge_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Script to Merge and Rename APK
        run: |
          import os
          import zipfile
          import shutil

          parts = [
              "horizon-android-part-01.zip",
              "horizon-android-part-02.zip",
              "horizon-android-part-03.zip"
          ]

          merged_zip = "horizon-android-merged.zip"
          temp_extract_dir = "temp_horizon_extract"
          apk_output_name = "MJLauncher.apk"

          print("Checking source files...")

          for part in parts:
              if not os.path.exists(part):
                  print(f"Error: Missing required file -> {part}")
                  exit(1)

          try:
              print("Merging parts into a single archive...")
              with open(merged_zip, "wb") as output_file:
                  for part in parts:
                      with open(part, "rb") as input_file:
                          output_file.write(input_file.read())

              if zipfile.is_zipfile(merged_zip):
                  print("Success: Valid merged zip file created.")
                  with zipfile.ZipFile(merged_zip, 'r') as zip_ref:
                      apk_files = [f for f in zip_ref.namelist() if f.endswith('.apk')]
                      if apk_files:
                          extracted_path = zip_ref.extract(apk_files[0])
                          if os.path.exists(apk_output_name):
                              os.remove(apk_output_name)
                          os.rename(extracted_path, apk_output_name)
                          print(f"Application Ready: {apk_output_name}")

              else:
                  print("Notice: Treating parts as independent archives...")
                  if os.path.exists(temp_extract_dir):
                      shutil.rmtree(temp_extract_dir)
                  os.makedirs(temp_extract_dir, exist_ok=True)

                  for part in parts:
                      with zipfile.ZipFile(part, 'r') as zip_ref:
                          zip_ref.extractall(temp_extract_dir)

                  found_apk = None
                  for root, dirs, files in os.walk(temp_extract_dir):
                      for file in files:
                          if file.endswith('.apk'):
                              found_apk = os.path.join(root, file)
                              break

                  if found_apk:
                      if os.path.exists(apk_output_name):
                          os.remove(apk_output_name)
                      shutil.move(found_apk, apk_output_name)
                      print(f"Application Ready: {apk_output_name}")
                  else:
                      print("Error: No .apk file found.")

          except Exception as e:
              print(f"An unexpected error occurred: {e}")
          finally:
              if os.path.exists(merged_zip):
                  os.remove(merged_zip)
              if os.path.exists(temp_extract_dir):
                  shutil.rmtree(temp_extract_dir)

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-App
          path: MJLauncher.apk
          
