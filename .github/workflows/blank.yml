name: Auto Merge and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Merge and Extract APK
        run: |
          python -c "
          import os, zipfile, shutil
          parts = ['horizon-android-part-01.zip', 'horizon-android-part-02.zip', 'horizon-android-part-03.zip']
          
          # التحقق من وجود الملفات
          for p in parts:
              if not os.path.exists(p): print(f'Missing: {p}'); exit(1)
          
          # دمج الملفات
          with open('merged.zip', 'wb') as f_out:
              for p in parts:
                  with open(p, 'rb') as f_in: f_out.write(f_in.read())
          
          # استخراج الـ APK
          if zipfile.is_zipfile('merged.zip'):
              with zipfile.ZipFile('merged.zip', 'r') as z:
                  apks = [x for x in z.namelist() if x.endswith('.apk')]
                  if apks:
                      z.extract(apks[0])
                      if os.path.exists('MJLauncher.apk'): os.remove('MJLauncher.apk')
                      os.rename(apks[0], 'MJLauncher.apk')
                      print('Done!')
                      exit(0)
          print('No APK found')
          exit(1)
          "

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-Build
          path: MJLauncher.apk
          
