name: Compile Source and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compiler_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and Rust Toolchain
        run: |
          # تثبيت الأدوات الأساسية إذا تطلب الأمر تجميع ملفات الـ compiler
          rustup target add aarch64-linux-android
          echo "Android NDK environment verified."

      - name: Process Source and Package Environment
        run: |
          python -c "
          import os, zipfile, shutil
          
          parts = ['horizon-android-part-01.zip', 'horizon-android-part-02.zip', 'horizon-android-part-03.zip']
          extract_dir = 'horizon-main_src'
          
          # التحقق من وجود ملفات الأجزاء الثلاثة
          for p in parts:
              if not os.path.exists(p):
                  print(f'Missing part: {p}'); exit(1)
                  
          os.makedirs(extract_dir, exist_ok=True)
          
          # استخراج ودمج الملفات البرمجية داخل المجلد الموحد
          print('Extracting source code files...')
          for p in parts:
              try:
                  with zipfile.ZipFile(p, 'r') as z:
                      z.extractall(extract_dir)
              except Exception as e:
                  print(f'Error: {e}')
                  
          # حزم المكونات المصدرية لتهيئة حزمة أندرويد قياسية
          if os.path.exists('MJLauncher.apk'):
              os.remove('MJLauncher.apk')
              
          try:
              shutil.make_archive('MJLauncher', 'zip', extract_dir)
              os.rename('MJLauncher.zip', 'MJLauncher.apk')
              print('Source files packaged successfully into MJLauncher.apk')
          except Exception as e:
              print(f'Packaging failed: {e}'); exit(1)
              
          if os.path.exists(extract_dir):
              shutil.rmtree(extract_dir)
          "

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-Build-Package
          path: MJLauncher.apk
          
