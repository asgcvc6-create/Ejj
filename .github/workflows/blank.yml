name: Auto Merge and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Merge and Extract APK
        run: |
          python -c "
          import os, zipfile, shutil
          parts = ['horizon-android-part-01.zip', 'horizon-android-part-02.zip', 'horizon-android-part-03.zip']
          
          for p in parts:
              if not os.path.exists(p): print(f'Missing: {p}'); exit(1)
          
          os.makedirs('extracted_temp', exist_ok=True)
          
          # فك ضغط كل الأجزاء بشكل مستقل لرؤية محتوياتها
          for p in parts:
              try:
                  with zipfile.ZipFile(p, 'r') as z:
                      z.extractall('extracted_temp')
              except Exception as e:
                  print(f'Error extracting {p}: {e}')

          # طباعة قائمة بكافة الملفات المستخرجة لنعرف ماذا يوجد بالداخل
          print('--- LIST OF ALL FILES EXTRACTED ---')
          all_files = []
          for root, dirs, files in os.walk('extracted_temp'):
              for file in files:
                  full_path = os.path.join(root, file)
                  all_files.append(full_path)
                  print(full_path)
          print('-----------------------------------')

          # البحث عن ملف الـ APK أو أي ملف يبدو كملف تطبيق
          found_apk = None
          for f in all_files:
              if f.lower().endswith('.apk'):
                  found_apk = f
                  break
          
          if found_apk:
              if os.path.exists('MJLauncher.apk'): os.remove('MJLauncher.apk')
              shutil.move(found_apk, 'MJLauncher.apk')
              print('APK Found and Processed Successfully!')
              exit(0)
          else:
              # إذا لم يجد APK، سيبحث عن ملفات OBB أو ملفات zip داخلية
              print('No .apk found. Looking for other zip files inside...')
              for f in all_files:
                  if f.endswith('.zip') and f != 'merged.zip':
                      try:
                          with zipfile.ZipFile(f, 'r') as z:
                              for internal_file in z.namelist():
                                  if internal_file.endswith('.apk'):
                                      z.extract(internal_file, 'final_apk_out')
                                      shutil.move(os.path.join('final_apk_out', internal_file), 'MJLauncher.apk')
                                      print('APK found inside internal zip!')
                                      exit(0)
                      except Exception:
                          pass
              
              print('CRITICAL ERROR: No APK file found inside the archive structure.')
              exit(1)
          "

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-Build
          path: MJLauncher.apk
          
